all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_become_password: "1234"
  children:
    Ubuntu_Servers:
      hosts:
        ap:
          ansible_host: 192.168.56.38
        s1:
          ansible_host: 192.168.56.39
        s2:
          ansible_host: 192.168.56.40

    kubernetes:
      children:
        kubernetes_master:
          hosts:
            ap:
        kubernetes_workers:
          hosts:
            s1:
            s2:

    longhorn:
      hosts:
        ap:
        s1:
        s2:

    terraform:
      hosts:
        ap:
        s2:

    helm:
      hosts:
        ap: # k8s_cilium 롤이 CNI 설치에 helm 사용 (마스터에서 실행)
        s2: # terraform 과 같은 배포 CLI 머신 (Helm 차트 스택 배포용)

    # kafka 그룹은 로컬 PV 디렉토리 선행작업(kafka_prereq) 대상이다
    kafka:
      hosts:
        ap:
        s1:
        s2:

    # hadoop 그룹은 로컬 PV 디렉토리 선행작업(hadoop_prereq) 대상이다
    hadoop:
      hosts:
        ap:
        s1:
        s2:

    # airflow 그룹은 DAG/코드 hostPath 디렉토리 선행작업(airflow_repo_prereq) 대상이다 — 스케줄 가능한 전 노드
    airflow:
      hosts:
        ap:
        s1:
        s2:

    buildkitd:
      hosts:
        ap: # 빌드 머신
        s2: # 빌드 머신
