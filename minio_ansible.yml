# =====================================================
# MinIO 노드 선행작업 (드라이브 준비)
# =====================================================
# ⚠ 서버 설치 플레이북이 아니다 — MinIO 서버는 K8s(Terraform 저장소 304-minio,
#   Helm — hostNetwork + hostPath 노드 고정 StatefulSet)로 이관됐다.
#   이 플레이는 그 차트가 전제하는 드라이브(루프 이미지 마운트)만 준비한다
#   — longhorn_prereq 와 같은 성격의 노드 선행작업이다.
#
# 컷오버 순서:
#   1) minio_remove_ansible.yml  — 구 systemd 설치 제거(같은 호스트 포트 9000/9001)
#   2) 이 플레이북               — 드라이브 확인/준비(멱등 — 살아 있으면 변경 없음)
#   3) helm install minio 304-minio (Terraform 저장소)
#
# 노드를 늘릴 때도 이 플레이북이 먼저다 — 드라이브 없이 304-minio values 의
# nodes 표에 추가하면 check-drives initContainer 가 기동을 멈춘다(의도된 실패).
# =====================================================
- name: "[ MinIO Prereq.. ]"
  hosts: minio
  become: true
  gather_facts: false

  roles:
    - minio_prereq # 루프 이미지 2장 생성/포맷/마운트(fstab) + 마운트 검증
