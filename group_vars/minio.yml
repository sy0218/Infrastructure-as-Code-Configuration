#########################################
# MinIO 드라이브 선행작업 변수 (minio_prereq 사용)
#
# ⚠ 서버 설치는 퇴역했다 — MinIO 는 K8s(Terraform 저장소 304-minio, Helm)로
#   이관됐고, 여기 남은 것은 그 차트가 전제하는 '드라이브 준비' 변수뿐이다
#   (longhorn_prereq 의 /data/longhorn 과 같은 성격의 노드 선행작업).
#   포트·자격증명·버킷·시드·버전 핀은 304-minio 차트(values.yaml)와
#   data_pipeline 의 Dockerfile 로 옮겨갔다.
# ⚠ minio_data_dir 는 304-minio values 의 minio.dataDir 와,
#   minio_drives 는 minio.drives 와 글자 그대로 같아야 한다(같은 커밋 규칙).
#########################################

#########################################
# 드라이브 구성 (minio_prereq 사용)
#
# [왜 노드당 2장인가]
#   MinIO 는 노드가 아니라 '드라이브(=경로)' 를 센다. 이레이저 코딩 최소 요건이
#   4드라이브라, 3노드 × 1장 = 3장으로는 아예 기동하지 않는다.
#   3노드 × 2장 = 6장이 3노드로 분산을 성립시키는 최소 구성이다.
#
#   실측(RELEASE.2025-09-07): 6드라이브 → 1 set, standardSCParity = 3
#     → 데이터 3조각 + 패리티 3조각. 6조각 중 3개만 살아도 원본 복원.
#     → 노드 1대(=2조각) 손실에도 읽기·쓰기 모두 정상. 가용 용량은 절반.
#
# [왜 폴더가 아니라 루프 이미지인가]
#   MinIO 는 드라이브가 '진짜 마운트된 파일시스템'인지 검사하고, 루트 디스크 위의
#   그냥 폴더면 "drive not found" 로 거부한다(실측 확인). 마운트가 풀린 줄 모르고
#   OS 디스크에 데이터를 쌓다 서버를 죽이는 사고를 막으려는 장치다.
#   이 랩에는 빈 블록 디바이스가 한 장도 없어(ap sdb·s2 sdb~sde 는 Longhorn 이 사용,
#   s1 은 추가 디스크 없음) VM 을 끄지 않고 드라이브를 만들 방법이 루프 이미지뿐이다.
#
#   [구조] 파일 하나를 리눅스가 디스크로 취급하게 만든다(ISO 파일과 같은 원리)
#     /var/lib/minio-drives/disk1.img  ── 리눅스 ──→ /dev/loopN ──마운트──→ /data/minio/disk1
#
#   부수 효과가 하나 더 있다: 이미지 크기가 상한이라 MinIO 가 꽉 채워도 루트 디스크는
#   무사하다. 위 검사가 막으려던 바로 그 사고를 실제로 막아 준다.
#   (K8s 파드 쪽에서도 같은 보호가 이어진다 — 304-minio 의 check-drives
#    initContainer 가 기동 전에 '진짜 마운트' 인지 확인한다. RequiresMountsFor 승계.)
#
# ⚠ 같은 물리 디스크 위라 '디스크 장애' 내구성은 없다 — 얻는 것은 '노드 장애' 내구성이다.
#   VM 랩에서 현실적인 사고가 후자라 받아들인 트레이드오프이며, 빈 디스크가 생기면
#   minio_image_dir 대신 그 디바이스를 마운트하는 것이 정공법이다.
#
# ⚠ 크기를 바꾸면 기존 이미지에는 적용되지 않는다(creates 로 멱등). 늘리려면
#   truncate + xfs_growfs 를 수동으로 하거나 데이터를 비우고 다시 만든다.
#   현재 값 기준 상한은 노드당 30G(루트 여유 ap 67G·s1 58G·s2 49G)이고,
#   오브젝트 가용 용량은 6 × 15G × 50% ≈ 45G 다.
#########################################
minio_data_dir: /data/minio # 드라이브 마운트 지점의 부모 (/data/minio/disk1, /disk2)
minio_image_dir: /var/lib/minio-drives # 드라이브 실체(루프 이미지 파일)가 놓이는 곳
minio_drives:
  - disk1
  - disk2
minio_drive_size: "15G" # truncate 는 sparse 파일이라 만드는 즉시 소비되지 않는다
minio_drive_fstype: xfs # MinIO 권장 파일시스템
