# =====================================================
# Kafka 노드 선행작업 변수 (Strimzi 로컬 PV)
# =====================================================
# 브로커는 K8s(Terraform 저장소 301-kafka)의 Strimzi 클러스터로 이관됐다.
# 이 그룹의 변수는 그 차트가 전제하는 **노드 디렉토리**만 다룬다
# — minio_prereq 의 드라이브, longhorn_prereq 의 /data/longhorn 과 같은 성격이다.
#
# [주의] 경로는 301-kafka values 의 kafka.broker.dataPath / kafka.controller.dataPath 와
#   같은 값이어야 한다(같은 커밋 규칙). 어긋나면 PV 가 없는 경로를 가리켜
#   파드가 마운트 실패로 멈춘다.
# =====================================================

# ⚠ /data/kafka 아래에 두지 않는다.
#   kafka_remove 롤이 구 systemd 브로커를 정리하며 /data/kafka 를 통째로 지운다
#   (그 롤의 가드는 유닛/설치루트 존재 여부라 데이터 경로를 보호하지 않는다).
#   경로를 갈라 두면 두 수명주기가 완전히 분리되어, 롤을 언제 실행해도 안전하다.
#   301-kafka 의 values.schema.json 도 같은 규칙을 'not' 패턴으로 강제한다.
kafka_broker_data_dir: /data/kafka-broker
kafka_controller_data_dir: /data/kafka-controller

# Strimzi 브로커/컨트롤러 컨테이너는 **비루트**로 뜬다(uid 1001, gid 0).
# 구 systemd 브로커의 kafka 계정과 달리 노드에 대응 계정이 없으므로 숫자로 지정한다.
#
# 소유자를 root 로 두고 그룹 쓰기(0770)를 여는 방식을 쓰는 이유:
#   파드 spec 의 fsGroup: 0 + fsGroupChangePolicy: OnRootMismatch 가
#   최상위 소유가 맞으면 재귀 chown 을 건너뛴다 → 데이터가 쌓인 뒤에도 기동이 느려지지 않는다.
kafka_data_owner: root
kafka_data_group: root
kafka_data_mode: '0770'
