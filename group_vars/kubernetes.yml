# =======================================
# Kubernetes / Container Runtime 버전 고정
#
# → Kubernetes 노드는 kubelet + containerd + runc 조합으로 동작한다.
# → 버전이 자동으로 올라가면 런타임 호환성이 깨질 수 있으므로
#   설치 버전을 명시적으로 고정한다.
#
# → 사용 가능한 패키지 버전 확인:
#   apt-cache madison <패키지명>
# =======================================

kubernetes_version: "1.34" # pkgs.k8s.io 저장소 버전
kubernetes_package_version: "1.34.4-1.1" # kubernetes 패키지 버전
containerd_version: "2.2.1-0ubuntu1~24.04.3" # 컨테이너 런타임 버전 → Ubuntu 24.04 AppArmor signal(DENIED) 버그 수정 포함
runc_version: "1.3.4-0ubuntu1~24.04.1" # runc 패키지 버전
sandbox_image: "registry.k8s.io/pause:3.10.1" # Pod Sandbox 이미지 q버전

# =======================================
# K8s 클러스터 구성 (k8s_master 사용)
# → init 이후 변경해도 재실행으로 반영되지 않음 (k8s_reset 후 재구축 필요)
# =======================================
pod_subnet: "10.244.0.0/16" # 노드망(192.168.56.x)과 겹치면 안 됨
kubernetes_swap_behavior: "LimitedSwap"
calico_version: "3.30.0"
node_cidr: "192.168.56.0/24" # Calico IP 자동감지용 (host-only NIC)
kubernetes_admin_user: "root" # 마스터에서 kubectl 사용할 계정 (.kube/config 배포 대상)

# =======================================
# HTTP 사설 레지스트리 허용 목록 (containerd 사용)
# → 이미지 주소의 host:port와 정확히 일치해야 함 (CIDR/대역 매칭 불가)
# → 변경 시 containerd 롤이 자동 재시작으로 반영
# =======================================
containerd_insecure_registries:
  # :80 이 반드시 필요하다 — 점(.)도 콜론(:)도 없는 단일 라벨은 Docker 이미지 참조
  # 파서가 레지스트리로 인정하지 않고 docker.io 밑의 경로로 정규화해 버린다
  # (data-layer-harbor/x → docker.io/data-layer-harbor/x). NodePort 시절에는
  # :30003 이 그 콜론 역할을 했고, Ingress(80) 전환으로 포트가 사라지며 깨졌다.
  - "data-layer-harbor:80" # Harbor (TLS 미사용 → HTTP 접속 허용)

# =======================================
# 필수 Ansible 컬렉션 (collection_check 사용)
# =======================================
required_collections:
  - ansible.posix # sysctl 모듈 (k8s_prereq)
  - community.general # modprobe 모듈 (k8s_prereq)
