# =====================================================
# Ubuntu Servers
# =====================================================


# -----------------------------------------------------
# 1. 사전 검증 → 필수 Ansible 컬렉션 (컨트롤 노드)
# -----------------------------------------------------
# hosts는 kubernetes_master지만
#   - connection: local이라 실제 실행은 컨트롤 노드에서만 이루어짐 (kubernetes 그룹 변수를 상속받기 위한 구성)
- name: "[ Check Ansible Collections.. ]"
  hosts: kubernetes_master
  connection: local
  gather_facts: false

  roles:
    - { role: collection_check, tags: ['collection_check'] }

# -----------------------------------------------------
# 2. K8s 공통 사전 준비 (ap, s1, s2)
# -----------------------------------------------------
- name: "[ K8s Common Setup.. ]"
  hosts: kubernetes
  become: true
  gather_facts: false

  roles:
    - { role: k8s_prereq,   tags: ['k8s_prereq'] }   # 커널 모듈(overlay/br_netfilter) + sysctl + cgroup v2 확인
    - { role: containerd,   tags: ['containerd'] }   # 컨테이너 런타임 설치/버전 고정 + SystemdCgroup 활성화
    - { role: k8s_packages, tags: ['k8s_packages'] } # k8s 저장소 등록 + kubeadm/kubelet/kubectl 설치/hold + node-ip 고정

# -----------------------------------------------------
# 3. K8s 컨트롤플레인 초기화 + CNI (ap)
# → kubeadm init은 최초 1회만 동작 (admin.conf 있으면 재실행해도 스킵)
# → 설정 바꿔서 다시 하려면 k8s_reset으로 클러스터 해체 후 재실행
# → k8s_master 직후에는 CNI가 없어 노드가 NotReady
#     — k8s_cilium 롤이 CNI를 설치하고 Ready까지 확인한다
# -----------------------------------------------------
- name: "[ K8s Control Plane.. ]"
  hosts: kubernetes_master
  become: true
  gather_facts: false

  roles:
    - { role: helm,       tags: ['helm'] }             # k8s_cilium 롤이 사용할 helm CLI
    - { role: k8s_master, tags: ['k8s_master'] }       # kubeadm init + kubeconfig 배포
    - { role: k8s_cilium, tags: ['k8s_cilium'] }       # CNI 설치 + Ready 검증

# -----------------------------------------------------
# 4. K8s 워커 조인 (s1, s2)
# -----------------------------------------------------
- name: "[ K8s Workers Join.. ]"
  hosts: kubernetes_workers
  become: true
  gather_facts: false

  roles:
    - { role: k8s_worker, tags: ['k8s_worker'] } # 워커 조인(1회성/재실행 스킵) + 전체 클러스터 검증

# -----------------------------------------------------
# 5. 클러스터 해체 → 위 K8s 롤 전부 주석 처리 후 아래 주석 해제
