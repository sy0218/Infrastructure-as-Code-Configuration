# ==================================================
# Ansible 기본 설정
# ==================================================


[defaults]
# 인벤토리 파일 (-i 옵션 불필요)
inventory = host.yml

# 원격 작업 임시 디렉토리 → 유저별 홈 하위 경로 필수
remote_tmp = ~/.ansible/tmp

# SSH 호스트 키 검증 생략 (플레이북 ansible_ssh_common_args 대체)
host_key_checking = False

# 롤 경로
roles_path = ./roles

# 출력 가독성
stdout_callback = yaml

# 커스텀 callback 플러그인 경로 (summary_table → 실행 결과 요약 표)
callback_plugins = ./callback_plugins

# *.retry 파일 생성 안 함
retry_files_enabled = False

# 동시 실행 호스트 수
forks = 2

# 롤 실패해도 notify 된 handler 실행
force_handlers = True

[ssh_connection]
# SSH 파이프라이닝 (실행 속도 향상)
pipelining = True
