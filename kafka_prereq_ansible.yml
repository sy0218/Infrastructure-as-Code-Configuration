# =====================================================
# Kafka 노드 선행작업 (Strimzi 로컬 PV 디렉토리)
# =====================================================
#
# 이 플레이북의 범위는 디렉토리 준비까지다 (멱등 — 있으면 변경 없음).
# Strimzi 오퍼레이터/Kafka 차트 설치는 엔지니어가 수동으로 한다.
#
# 노드를 늘릴 때도 이 플레이북이 먼저다
# 디렉토리 없이 301-kafka values 의 nodes 표에 추가하면 그 노드의 PV 가 마운트에 실패해 파드가 멈춘다
# =====================================================
- name: "[ Kafka Prereq.. ]"
  hosts: kafka
  become: true
  gather_facts: false

  roles:
    - { role: kafka_prereq, tags: ['kafka_prereq'] } # 디렉토리 2종 생성 + 권한 검증
