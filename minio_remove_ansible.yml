# =====================================================
# MinIO 로컬(systemd) 설치 제거 — K8s(Helm 304-minio) 이관 컷오버
#   → 새 서버가 같은 호스트 포트(9000/9001)를 쓰므로
#     Terraform 저장소 304-minio 의 helm install 전에 먼저 실행한다.
#   → 드라이브 내용물까지 비운다(복구 불가) — 이관 결정에 포함된 사항.
#     드라이브 자체(루프 이미지·마운트)는 304-minio 가 hostPath 로 이어받으므로 남긴다.
#   → 대상은 minio 그룹(ap·s1·s2) — 드라이브 변수(group_vars/minio.yml)가 필요해
#     kafka_remove(Ubuntu_Servers)와 달리 그룹이 존속한다.
# =====================================================
- name: "[ MinIO Remove (systemd → K8s 이관) ]"
  hosts: minio
  become: true
  gather_facts: false

  roles:
    - { role: minio_remove, tags: ['minio_remove'] } # 서비스 중지/해제 + 유닛/설정/계정 제거 + 드라이브 비우기 + 검증
