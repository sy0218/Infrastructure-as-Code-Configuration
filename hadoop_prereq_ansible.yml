# =====================================================
# Hadoop 노드 선행작업 (301-hadoop HDFS HA StatefulSet 의 로컬 PV 디렉토리)
# =====================================================
#   - 이 플레이북의 범위는 디렉토리 준비까지다 (멱등 → 있으면 변경 없음).
#
# [주의]
#   - 노드를 늘릴 때도 이 플레이북이 먼저다
#   - 디렉토리 없이 301-hadoop 의 nodeNames 목록에 추가하면 그 노드의 PV 가 마운트에 실패해 파드가 멈춘다
# =====================================================
- name: "[ Hadoop Prereq.. ]"
  hosts: hadoop
  become: true
  gather_facts: false

  roles:
    - { role: hadoop_prereq, tags: ['hadoop_prereq'] } # 디렉토리 4종 생성 + 권한 검증
